<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<p>Gold</p>
		<p>Gold hex</p>
		<p>Gold rgb</p>
		<p>Gold hsl</p>

		<button>hoi</button>
	</body>

	<style>
		p:nth-of-type(1) {
			color: gold;
		}

		p:nth-of-type(2) {
			color: rgb(255 200 0);
			/* color: rgb(255 215 0);  antwoord*/
		}

		p:nth-of-type(3) {
			color: hsl(50 97 53);
			/* color: hsl(51 100 50) ;  antwoord*/
		}

		p:nth-of-type(4) {
			color: #f00;
		}

		button {
			--h: 100;
			--s: 50%;
			--l: 50%;
			--a: 1;

			background: hsl(var(--h) var(--s) var(--l) / var(--a));

			&:hover {
				--l: 75%;
			}
		}
	</style>
</html>
